[project]
name = "capturekarma"
version = "2.0.0a1"
description = "Record a product demo once, replay it with cinematic cursor and scroll motion, capture to MP4."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "pynput>=1.7.7",
    "Pillow>=10.4",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "PySide6>=6.7",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
ck = "capturekarma.cli:main"
ck-gui = "capturekarma.gui.app:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capturekarma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "win32: needs a Windows desktop session (screen, Win32 APIs)",
    "integration: needs Playwright Chromium installed",
]
addopts = "-ra"
